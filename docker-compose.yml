
services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy

  db:
    build: db/.
    restart: always
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 20
      interval: 5s
